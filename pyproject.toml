[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ionospheric-scintillation-detection"
version = "0.1.0"
description = "Beidou/GNSS ionospheric scintillation desktop MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ISD Team" }]
dependencies = [
  "PySide6>=6.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pyqtgraph>=0.13",
  "matplotlib>=3.8",
  "cartopy>=0.23",
  "structlog>=24.1",
  "python-dateutil>=2.9",
]

[project.scripts]
isd = "isd.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
